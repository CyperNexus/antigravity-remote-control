<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Remote Control</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        header {
            padding: 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-dot.waiting {
            background-color: var(--warning-color);
            box-shadow: 0 0 8px var(--warning-color);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .message.agent {
            align-self: flex-start;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .message.user .meta {
            color: #1e293b;
        }

        footer {
            padding: 16px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
        }

        form {
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.95rem;
            resize: none;
            height: 44px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <span id="status-dot" class="status-dot"></span>
            Antigravity Remote
        </h1>
        <span id="status-text" style="font-size: 0.85rem; color: var(--text-secondary);">Đang mở...</span>
    </header>

    <div id="chat-container">
        <div class="message agent">
            <div class="meta">Antigravity System</div>
            Chào mừng bạn đến với Antigravity Remote Interface. Hãy nhập yêu cầu bên dưới để gửi tới Agent trên máy tính của bạn.
        </div>
    </div>

    <footer>
        <form id="prompt-form">
            <textarea id="prompt-input" placeholder="Nhập câu lệnh/yêu cầu cho Antigravity..." required></textarea>
            <button type="submit" id="send-btn">Gửi</button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptForm = document.getElementById('prompt-form');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let lastMessageId = 0;

        async function fetchLogs() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                if (data.is_waiting) {
                    statusDot.className = 'status-dot waiting';
                    statusText.textContent = 'Đang chờ lệnh mới...';
                } else {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Agent đang xử lý...';
                }

                if (data.messages && data.messages.length > lastMessageId) {
                    for (let i = lastMessageId; i < data.messages.length; i++) {
                        appendMessage(data.messages[i].sender, data.messages[i].text);
                    }
                    lastMessageId = data.messages.length;
                }
            } catch (e) {
                statusDot.className = 'status-dot';
                statusDot.style.backgroundColor = '#ef4444';
                statusText.textContent = 'Mất kết nối';
            }
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user' : 'agent'}`;
            
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            metaDiv.textContent = sender === 'user' ? 'Bạn' : 'Antigravity';
            
            const textNode = document.createTextNode(text);

            msgDiv.appendChild(metaDiv);
            msgDiv.appendChild(textNode);
            chatContainer.appendChild(msgDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        promptForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = promptInput.value.trim();
            if (!text) return;

            promptInput.value = '';
            sendBtn.disabled = true;

            try {
                await fetch('/api/send_task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
            } catch (err) {
                alert('Không thể gửi tin nhắn!');
            } finally {
                sendBtn.disabled = false;
            }
        });

        // Enter to submit (Shift+Enter for new line)
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                promptForm.dispatchEvent(new Event('submit'));
            }
        });

        setInterval(fetchLogs, 1500);
        fetchLogs();
    </script>
</body>
</html>
